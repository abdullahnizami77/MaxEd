<rect x="207.33" y="1020.5" width="137.34" height="27.82" rx="6" ry="6" fill="#ffffff" stroke="#d8dde3" stroke-width="1"/>
<text x="276" y="1039.76" font-size="13.5" font-weight="700" text-anchor="middle" fill="#161b22">Fixable error</text>
<rect x="557.2" y="1020.5" width="201.6" height="27.82" rx="6" ry="6" fill="#ffffff" stroke="#d8dde3" stroke-width="1"/>
<text x="658" y="1039.76" font-size="13.5" font-weight="700" text-anchor="middle" fill="#161b22">Correct and complete</text>
<rect x="916.25" y="1020.5" width="247.5" height="27.82" rx="6" ry="6" fill="#ffffff" stroke="#d8dde3" stroke-width="1"/>
<text x="1040" y="1039.76" font-size="13.5" font-weight="700" text-anchor="middle" fill="#161b22">Ambiguous or unverifiable</text>
<path d="M 108 1160.22 L 75 1160.22 Q 62 1160.22 62 1147.22 L 62 487.44 Q 62 474.44 75 474.44 L 308 474.44" fill="none" stroke="#7a5aa8" stroke-width="1.9" stroke-dasharray="6 5" stroke-linecap="round" marker-end="url(#ahfb)"/>
<text x="49.9" y="821.92" font-size="13.5" fill="#7a5aa8" text-anchor="middle" transform="rotate(-90 49.9 821.92)">Re-draft with the exact correction</text>
<path d="M 1008 1494.18 L 1241 1494.18 Q 1254 1494.18 1254 1481.18 L 1254 487.44 Q 1254 474.44 1241 474.44 L 1008 474.44" fill="none" stroke="#7a5aa8" stroke-width="1.9" stroke-dasharray="6 5" stroke-linecap="round" marker-end="url(#ahfb)"/>
<text x="1266.1" y="988.9" font-size="13.5" fill="#7a5aa8" text-anchor="middle" transform="rotate(-90 1266.1 988.9)">Used on a future similar account</text>
<rect x="108" y="1563.88" width="13" height="13" rx="3" ry="3" fill="#2f6feb"/>
<text x="128" y="1574.88" font-size="13" fill="#454e58">Pipeline step</text>
<rect x="258.78" y="1563.88" width="13" height="13" rx="3" ry="3" fill="#6b46c1"/>
<text x="278.78" y="1574.88" font-size="13" fill="#454e58">Decision</text>
<rect x="369.26" y="1563.88" width="13" height="13" rx="3" ry="3" fill="#b8730a"/>
<text x="389.26" y="1574.88" font-size="13" fill="#454e58">Loops back</text>
<rect x="498.36" y="1563.88" width="13" height="13" rx="3" ry="3" fill="#1a7f37"/>
<text x="518.36" y="1574.88" font-size="13" fill="#454e58">Human decision</text>
<rect x="660.86" y="1563.88" width="13" height="13" rx="3" ry="3" fill="#b3261e"/>
<text x="680.86" y="1574.88" font-size="13" fill="#454e58">Stops, nothing is sent</text>
<rect x="884.18" y="1563.88" width="13" height="13" rx="3" ry="3" fill="#0f6f7d"/>
<text x="904.18" y="1574.88" font-size="13" fill="#454e58">Learning loop</text>
</svg>
