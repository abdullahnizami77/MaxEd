<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1315.01" height="1620.88" viewBox="0 0 1315.01 1620.88" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="ttl dsc" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
<title id="ttl">How BALANCECHECK works</title>
<desc id="dsc">Vertical flowchart of the BALANCECHECK pipeline. Step 1 reads the account records: invoices, payments, credit notes and how each payment was applied. Step 2 computes the trusted facts in code. Step 3 drafts the client reply with a small language model. Step 4 breaks the reply into six kinds of claim. Step 5 checks every claim, in code for factual claims and with an isolated model for soft claims, plus two whole-draft checks. Step 6 applies a fixed rule table with no model involved, and has three outcomes. A fixable error takes the revision path, which loops back to step 3 so the model re-drafts with the exact correction and the checks run again. A correct and complete draft goes to step 7, human review, where a person approves, edits or declines it. An ambiguous or unverifiable case leads to a safe stop: abstain or escalate. Step 8 learns from the human decision and step 9 improves future drafts, feeding approved examples back into step 3. Every draft, check, tool call, decision and score is recorded in one event log.</desc>
<defs>
<marker id="ah" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="9" refX="12" refY="4.5" viewBox="0 0 12 9" orient="auto"><path d="M 0 0 L 12 4.5 L 0 9 L 2.6 4.5 Z" fill="#4c555f"/></marker>
<marker id="ahfb" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="9" refX="12" refY="4.5" viewBox="0 0 12 9" orient="auto"><path d="M 0 0 L 12 4.5 L 0 9 L 2.6 4.5 Z" fill="#7a5aa8"/></marker>
</defs>
<rect x="0" y="0" width="1315.01" height="1620.88" fill="#ffffff"/>
<text x="108" y="71.68" font-size="30" font-weight="700" fill="#161b22">How BALANCECHECK works</text>
<text x="108" y="98.5" font-size="16" fill="#454e58">Draft the reply, check every claim, stop safely, and learn from human decisions.</text>
<g role="group" aria-label="Every draft, check, tool call, decision and score is recorded in one event log.">
<rect x="108" y="122.72" width="1100" height="44.46" rx="11" ry="11" fill="#f2f3f5" stroke="#c8ccd2" stroke-width="1.6"/>
<rect x="111" y="131.72" width="5" height="26.46" rx="2.5" ry="2.5" fill="#57606a"/>
<text x="128" y="151.09" font-size="15.5" font-weight="700" fill="#161b22">Every draft, check, tool call, decision and score is recorded in one event log.</text>
</g>
<g role="group" aria-label="1. Read the account records">
<rect x="308" y="197.18" width="700" height="68.92" rx="11" ry="11" fill="#f4f7fb" stroke="#c3ccd6" stroke-width="1.6"/>
<rect x="311" y="206.18" width="5" height="50.92" rx="2.5" ry="2.5" fill="#2f6feb"/>
<text x="328" y="227.13" font-size="17" font-weight="700" fill="#161b22">1. Read the account records</text>
<text x="328" y="250.4" font-size="14" fill="#454e58">Invoices, payments, credit notes and how each payment was applied.</text>
</g>
<g role="group" aria-label="2. Calculate the trusted facts">
<rect x="308" y="300.1" width="700" height="87.4" rx="11" ry="11" fill="#f4f7fb" stroke="#c3ccd6" stroke-width="1.6"/>
<rect x="311" y="309.1" width="5" height="69.4" rx="2.5" ry="2.5" fill="#2f6feb"/>
<text x="328" y="330.05" font-size="17" font-weight="700" fill="#161b22">2. Calculate the trusted facts</text>
<text x="328" y="353.32" font-size="14" fill="#454e58">Code computes open amounts, invoice status and the final balance. The LLM</text>
<text x="328" y="371.8" font-size="14" fill="#454e58">does not do the maths.</text>
</g>
<g role="group" aria-label="3. Write the client reply">
<rect x="308" y="421.5" width="700" height="105.88" rx="11" ry="11" fill="#f4f7fb" stroke="#c3ccd6" stroke-width="1.6"/>
<rect x="311" y="430.5" width="5" height="87.88" rx="2.5" ry="2.5" fill="#2f6feb"/>
<text x="328" y="451.45" font-size="17" font-weight="700" fill="#161b22">3. Write the client reply</text>
<text x="328" y="474.72" font-size="14" fill="#454e58">A small language model turns those trusted facts into a clear email. The</text>
<text x="328" y="493.2" font-size="14" fill="#454e58">same prompt carries retrieved approved examples and, on a re-draft, the</text>
<text x="328" y="511.68" font-size="14" fill="#454e58">exact correction.</text>
</g>
<g role="group" aria-label="4. Break the reply into claims">
<rect x="308" y="561.38" width="700" height="105.88" rx="11" ry="11" fill="#f4f7fb" stroke="#c3ccd6" stroke-width="1.6"/>
<rect x="311" y="570.38" width="5" height="87.88" rx="2.5" ry="2.5" fill="#2f6feb"/>
<text x="328" y="591.33" font-size="17" font-weight="700" fill="#161b22">4. Break the reply into claims</text>
<text x="328" y="614.6" font-size="14" fill="#454e58">Code pulls out six kinds of claim: document references, amounts, totals,</text>
<text x="328" y="633.08" font-size="14" fill="#454e58">dates, statuses and softer statements. Anything it spots but cannot pin to a</text>
<text x="328" y="651.56" font-size="14" fill="#454e58">ledger figure is escalated, never dropped.</text>
</g>
<g role="group" aria-label="5. Check every claim">
<rect x="308" y="701.26" width="700" height="124.36" rx="11" ry="11" fill="#f4f7fb" stroke="#c3ccd6" stroke-width="1.6"/>
<rect x="311" y="710.26" width="5" height="106.36" rx="2.5" ry="2.5" fill="#2f6feb"/>
<text x="328" y="731.21" font-size="17" font-weight="700" fill="#161b22">5. Check every claim</text>
<text x="328" y="754.48" font-size="14" fill="#454e58">Code checks factual claims against the ledger. An isolated LLM checks only</text>
<text x="328" y="772.96" font-size="14" fill="#454e58">soft claims such as 'as discussed'. Two more checks read the whole draft:</text>
<text x="328" y="791.44" font-size="14" fill="#454e58">the listed amounts must match the totals, and required content must be</text>
<text x="328" y="809.92" font-size="14" fill="#454e58">present.</text>
</g>
<g role="group" aria-label="6. What did the checks find?">
<path d="M 658 859.62 L 929.48 912.06 L 658 964.5 L 386.52 912.06 Z" fill="#f6f2fd" stroke="#6b46c1" stroke-width="1.8"/>
<text x="658" y="907.57" font-size="17" font-weight="700" text-anchor="middle" fill="#161b22">6. What did the checks find?</text>
<text x="658" y="930.01" font-size="17" font-weight="700" text-anchor="middle" fill="#161b22">(fixed rules, no model)</text>
</g>
<g role="group" aria-label="Revision path">
<rect x="108" y="1070.32" width="336" height="179.8" rx="11" ry="11" fill="#fdf6ec" stroke="#e0c48f" stroke-width="1.6" stroke-dasharray="7 4"/>
<rect x="111" y="1079.32" width="5" height="161.8" rx="2.5" ry="2.5" fill="#b8730a"/>
<text x="128" y="1100.27" font-size="17" font-weight="700" fill="#161b22">Revision path</text>
<text x="128" y="1123.54" font-size="14" fill="#454e58">The gate sends back the exact</text>
<text x="128" y="1142.02" font-size="14" fill="#454e58">correction and the model writes a</text>
<text x="128" y="1160.5" font-size="14" fill="#454e58">new reply. At most two revisions,</text>
<text x="128" y="1178.98" font-size="14" fill="#454e58">and a repeated draft escalates</text>
<text x="128" y="1197.46" font-size="14" fill="#454e58">instead of looping. An opt-in mode</text>
<text x="128" y="1215.94" font-size="14" fill="#454e58">replaces the re-draft with a</text>
<text x="128" y="1234.42" font-size="14" fill="#454e58">bounded tool-using agent.</text>
</g>
<g role="group" aria-label="7. Human review">
<rect x="490" y="1070.32" width="336" height="142.84" rx="11" ry="11" fill="#f1faf3" stroke="#a9d5b5" stroke-width="1.6"/>
<rect x="493" y="1079.32" width="5" height="124.84" rx="2.5" ry="2.5" fill="#1a7f37"/>
<text x="510" y="1100.27" font-size="17" font-weight="700" fill="#161b22">7. Human review</text>
<text x="510" y="1123.54" font-size="14" fill="#454e58">A person approves, edits or</text>
<text x="510" y="1142.02" font-size="14" fill="#454e58">declines the reply. Nothing is</text>
<text x="510" y="1160.5" font-size="14" fill="#454e58">ever sent automatically. An edited</text>
<text x="510" y="1178.98" font-size="14" fill="#454e58">reply is re-checked by code before</text>
<text x="510" y="1197.46" font-size="14" fill="#454e58">it is stored.</text>
</g>
<g role="group" aria-label="Safe stop">
<rect x="872" y="1070.32" width="336" height="198.28" rx="11" ry="11" fill="#fdf3f2" stroke="#e4bab4" stroke-width="1.6"/>
<rect x="875" y="1079.32" width="5" height="180.28" rx="2.5" ry="2.5" fill="#b3261e"/>
<text x="892" y="1100.27" font-size="17" font-weight="700" fill="#161b22">Safe stop</text>
<text x="892" y="1123.54" font-size="14" fill="#454e58">Abstain when the records cannot</text>
<text x="892" y="1142.02" font-size="14" fill="#454e58">support any true reply. The</text>
<text x="892" y="1160.5" font-size="14" fill="#454e58">clearest case is caught before</text>
<text x="892" y="1178.98" font-size="14" fill="#454e58">drafting, so no model call is</text>
<text x="892" y="1197.46" font-size="14" fill="#454e58">spent. Escalate when a claim</text>
<text x="892" y="1215.94" font-size="14" fill="#454e58">cannot be verified, the revision</text>
<text x="892" y="1234.42" font-size="14" fill="#454e58">budget runs out, or the draft</text>
<text x="892" y="1252.9" font-size="14" fill="#454e58">repeats itself.</text>
</g>
<g role="group" aria-label="8. Learn from the human decision">
<rect x="308" y="1310.6" width="700" height="105.88" rx="11" ry="11" fill="#eff9fa" stroke="#a5cfd6" stroke-width="1.6"/>
<rect x="311" y="1319.6" width="5" height="87.88" rx="2.5" ry="2.5" fill="#0f6f7d"/>
<text x="328" y="1340.55" font-size="17" font-weight="700" fill="#161b22">8. Learn from the human decision</text>
<text x="328" y="1363.82" font-size="14" fill="#454e58">Approved and edited replies become examples, keyed by the shape of the</text>
<text x="328" y="1382.3" font-size="14" fill="#454e58">ledger case. Declines are logged but not learned from. Evaluation scenarios</text>
<text x="328" y="1400.78" font-size="14" fill="#454e58">never enter memory.</text>
</g>
<g role="group" aria-label="9. Improve future drafts">
<rect x="308" y="1450.48" width="700" height="87.4" rx="11" ry="11" fill="#eff9fa" stroke="#a5cfd6" stroke-width="1.6"/>
<rect x="311" y="1459.48" width="5" height="69.4" rx="2.5" ry="2.5" fill="#0f6f7d"/>
<text x="328" y="1480.43" font-size="17" font-weight="700" fill="#161b22">9. Improve future drafts</text>
<text x="328" y="1503.7" font-size="14" fill="#454e58">The next similar account receives the most relevant approved examples in its</text>
<text x="328" y="1522.18" font-size="14" fill="#454e58">drafting prompt.</text>
</g>
